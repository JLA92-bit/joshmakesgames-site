# Temporary: discovers data series for new River Watch features. Read-only, removed after use.
name: River Watch probe
on:
  push:
    branches: [claude/relaxed-pasteur-rrxgbb]
    paths: [river-watch/collector/probe.mjs, .github/workflows/river-watch-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node river-watch/collector/probe.mjs
