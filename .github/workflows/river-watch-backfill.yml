# River Watch - history back-fill and past-flood builder (run by hand from the Actions tab)
# Created by Josh Avard
name: Back-fill history

on:
  workflow_dispatch:
    inputs:
      only:
        description: "What to build"
        type: choice
        options: [all, daily, rain, storage, soil, events]
        default: all
      from:
        description: "Start year"
        default: "1970"
      force:
        description: "Rebuild past-flood files that already exist"
        type: boolean
        default: false

permissions:
  contents: write
  
concurrency:
  group: river-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---- daily: built and saved on its own, so a stall later never loses it
      - name: Back-fill daily
        if: inputs.only == 'all' || inputs.only == 'daily'
        continue-on-error: true
        timeout-minutes: 150
        run: node river-watch/collector/backfill.mjs --only daily --from "${{ inputs.from }}" ${{ inputs.force && '--force' || '' }}
      - name: Save daily
        if: always() && (inputs.only == 'all' || inputs.only == 'daily')
        env:
          STAGE: daily
        run: bash river-watch/collector/save.sh "History back-fill - $STAGE (from ${{ inputs.from }})"

      # ---- rain: built and saved on its own, so a stall later never loses it
      - name: Back-fill rain
        if: inputs.only == 'all' || inputs.only == 'rain'
        continue-on-error: true
        timeout-minutes: 60
        run: node river-watch/collector/backfill.mjs --only rain --from "${{ inputs.from }}" ${{ inputs.force && '--force' || '' }}
      - name: Save rain
        if: always() && (inputs.only == 'all' || inputs.only == 'rain')
        env:
          STAGE: rain
        run: bash river-watch/collector/save.sh "History back-fill - $STAGE (from ${{ inputs.from }})"

      # ---- storage: built and saved on its own, so a stall later never loses it
      - name: Back-fill storage
        if: inputs.only == 'all' || inputs.only == 'storage'
        continue-on-error: true
        timeout-minutes: 20
        run: node river-watch/collector/backfill.mjs --only storage --from "${{ inputs.from }}" ${{ inputs.force && '--force' || '' }}
      - name: Save storage
        if: always() && (inputs.only == 'all' || inputs.only == 'storage')
        env:
          STAGE: storage
        run: bash river-watch/collector/save.sh "History back-fill - $STAGE (from ${{ inputs.from }})"

      # ---- soil: built and saved on its own, so a stall later never loses it
      - name: Back-fill soil
        if: inputs.only == 'all' || inputs.only == 'soil'
        continue-on-error: true
        timeout-minutes: 40
        run: node river-watch/collector/backfill.mjs --only soil --from "${{ inputs.from }}" ${{ inputs.force && '--force' || '' }}
      - name: Save soil
        if: always() && (inputs.only == 'all' || inputs.only == 'soil')
        env:
          STAGE: soil
        run: bash river-watch/collector/save.sh "History back-fill - $STAGE (from ${{ inputs.from }})"

      # ---- events: built and saved on its own, so a stall later never loses it
      - name: Back-fill events
        if: inputs.only == 'all' || inputs.only == 'events'
        continue-on-error: true
        timeout-minutes: 90
        run: node river-watch/collector/backfill.mjs --only events --from "${{ inputs.from }}" ${{ inputs.force && '--force' || '' }}
      - name: Save events
        if: always() && (inputs.only == 'all' || inputs.only == 'events')
        env:
          STAGE: events
        run: bash river-watch/collector/save.sh "History back-fill - $STAGE (from ${{ inputs.from }})"

      - name: Refresh the latest snapshot
        if: always()
        timeout-minutes: 15
        run: node river-watch/collector/collect.mjs
      - name: Save the snapshot
        if: always()
        env:
          STAGE: latest snapshot
        run: bash river-watch/collector/save.sh "History back-fill - $STAGE (from ${{ inputs.from }})"
