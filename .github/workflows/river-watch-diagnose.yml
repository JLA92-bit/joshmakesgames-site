# River Watch - temporary read-only diagnosis of gauges that return nothing (runs on pushes to the work branch only)
name: Diagnose river data

on:
  push:
    branches: [claude/magical-fermi-askcu5]
    paths: [river-watch/collector/diagnose.mjs]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnose
        run: node river-watch/collector/diagnose.mjs
