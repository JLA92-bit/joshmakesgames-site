# Temporary: times WMIS daily flow requests of different lengths. Read-only, removed after use.
name: River Watch timing test
on:
  push:
    branches: [claude/relaxed-pasteur-rrxgbb]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node river-watch/collector/timing.mjs
