# Vic Election 2026 - One Nation tracker: scrape VEC results and save them to the site
# A pushed change or a manual run keeps collecting every 3 minutes for about 5.5 hours, because GitHub's
# scheduled runs can be delayed for hours on busy nights. The schedule is a fallback single pass.
# Created by Josh Avard
name: Collect Vic election results

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep collecting for this many minutes (0 = once)"
        default: "330"
  push:
    branches: [main]
    paths: ["vic-election/collector/**", ".github/workflows/vic-election-collect.yml"]

permissions:
  contents: write

concurrency:
  group: vic-election
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: vic-election
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r collector/requirements.txt
      - name: Collect, analyse and save
        env:
          VEC_BASE: ${{ vars.VEC_BASE }}
        run: bash collector/loop.sh "${{ github.event_name == 'schedule' && '0' || (inputs.minutes || '330') }}" 180
