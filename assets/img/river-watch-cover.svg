<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="River Watch: a river winding through farmland with a gauge post and a line chart of river height">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a3d"/>
      <stop offset="1" stop-color="#16425b"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fa9f5"/>
      <stop offset="1" stop-color="#7fd3ff"/>
    </linearGradient>
    <pattern id="grid" width="64" height="50" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1024" height="500" fill="url(#sky)"/>
  <rect width="1024" height="500" fill="url(#grid)"/>
  <!-- flood class bands -->
  <rect x="0" y="120" width="1024" height="2" fill="#ef4444" opacity=".55"/>
  <rect x="0" y="170" width="1024" height="2" fill="#f59e0b" opacity=".55"/>
  <rect x="0" y="220" width="1024" height="2" fill="#facc15" opacity=".55"/>
  <text x="996" y="112" fill="#fca5a5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end">MAJOR</text>
  <text x="996" y="162" fill="#fcd34d" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end">MODERATE</text>
  <text x="996" y="212" fill="#fde68a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="end">MINOR</text>
  <!-- river height line -->
  <path d="M0 310 C120 306 220 300 300 292 S420 262 470 230 S560 104 610 100 S680 190 730 236 S850 290 940 296 S1000 298 1024 298" fill="none" stroke="url(#water)" stroke-width="7" stroke-linecap="round"/>
  <path d="M0 310 C120 306 220 300 300 292 S420 262 470 230 S560 104 610 100 S680 190 730 236 S850 290 940 296 S1000 298 1024 298 V500 H0Z" fill="#3fa9f5" opacity=".14"/>
  <circle cx="610" cy="100" r="11" fill="#7fd3ff" stroke="#0f2a3d" stroke-width="5"/>
  <!-- land and river -->
  <path d="M0 360 C160 340 300 372 470 356 S800 336 1024 352 V500 H0Z" fill="#1d4a34"/>
  <path d="M0 410 C180 380 330 440 520 418 S820 380 1024 402 V446 C820 428 640 470 500 460 S170 428 0 456Z" fill="url(#water)"/>
  <path d="M120 424 h60 M420 440 h46 M720 414 h70" stroke="#e0f4ff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- gauge post -->
  <g transform="translate(830 250)">
    <rect x="0" y="0" width="34" height="190" rx="4" fill="#f8fafc"/>
    <g fill="#0f2a3d">
      <rect x="0" y="20" width="18" height="5"/><rect x="0" y="50" width="26" height="5"/>
      <rect x="0" y="80" width="18" height="5"/><rect x="0" y="110" width="26" height="5"/>
      <rect x="0" y="140" width="18" height="5"/><rect x="0" y="170" width="26" height="5"/>
    </g>
  </g>
</svg>
